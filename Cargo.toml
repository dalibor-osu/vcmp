[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "26.10.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dalibor-osu/vcmp"

[workspace.dependencies]
slint = "1.18.1"
slint-build = "1.18.1"

# Debug builds optimise the dependencies (Slint and its renderer, image decoding,
# audio decoding), which are otherwise tens of times slower: the album grid took
# 46 ms a frame and a cover 58 ms to decode. VCMP's own crates stay unoptimised, so
# rebuilding them stays quick.
[profile.dev.package."*"]
opt-level = 3
# Line tables only: backtraces through dependencies keep files and lines, while the
# full debug info made every test binary 400 to 660 MB, which filled the CI runner's
# disk until the linker crashed (bus error).
debug = "line-tables-only"

# Release builds are what the installers ship: without symbols the binary is about
# a quarter smaller.
[profile.release]
strip = true
