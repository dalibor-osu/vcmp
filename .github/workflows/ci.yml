name: CI

# Turned off for now: it runs only when started by hand from the Actions tab
# (Run workflow), and then on all three systems. To turn it back on, restore the
# push and pull_request triggers.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  # pull_request:

# A newer push to the same pull request (or branch) cancels the run it replaces.
# Pushes to main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Test binaries without debug info. With it, each took 400 to 660 MB, and the
  # Linux runner's disk filled up until the linker crashed with a bus error. Panic
  # messages still name the file and line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_DEV_STRIP: debuginfo

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows and macOS minutes cost two and ten times Linux ones on a private
        # repository, so they run where code reaches main: pull requests into main
        # and pushes to it (and runs started by hand). Pull requests between feature
        # branches run on Linux.
        os: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main') && '["ubuntu-latest", "windows-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
