name: Release

# A pushed tag vYY.MM.PATCH on main (a calendar version, README "Versions") builds
# VCMP for each platform and attaches an archive of each to a draft GitHub Release:
# a zip of vcmp.exe on Windows, a zip of VCMP.app on macOS, a tar.gz of vcmp on
# Linux, each with the licence texts. Running the workflow by hand
# (workflow_dispatch) builds the same archives as downloadable workflow artifacts
# and creates no release. Installers (the cargo-packager configuration in
# crates/vcmp-app/Cargo.toml) are left for later; the builds are unsigned.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_PACKAGER_VERSION: 0.11.8

jobs:
  check:
    name: Check the tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag is on main and matches the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the workspace version $version in Cargo.toml"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"
            exit 1
          fi

  package:
    name: Build (${{ matrix.name }})
    needs: check
    # Runs after a passing check on a tag, and without the check on a manual run.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x64
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            platform: macos-arm64
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            platform: macos-x64
          # The oldest supported Ubuntu runner: the build then runs on any
          # distribution with glibc 2.35 or newer.
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      # Only on macOS, for the VCMP.app bundle (no installer).
      - uses: taiki-e/install-action@v2
        if: runner.os == 'macOS'
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      # API keys for the web integrations, compiled in with option_env!. Secrets
      # that are not set stay out of the environment, so the build sees them as
      # missing rather than empty.
      - name: Pass the integration keys to the build
        shell: bash
        env:
          VCMP_LASTFM_API_KEY: ${{ secrets.VCMP_LASTFM_API_KEY }}
          VCMP_LASTFM_SHARED_SECRET: ${{ secrets.VCMP_LASTFM_SHARED_SECRET }}
          VCMP_FANARTTV_API_KEY: ${{ secrets.VCMP_FANARTTV_API_KEY }}
        run: |
          for name in VCMP_LASTFM_API_KEY VCMP_LASTFM_SHARED_SECRET VCMP_FANARTTV_API_KEY; do
            if [ -n "${!name}" ]; then
              echo "$name=${!name}" >> "$GITHUB_ENV"
              echo "$name is set"
            fi
          done

      - name: Build
        run: cargo build --release --locked -p vcmp-app --target ${{ matrix.target }}

      # vcmp-<version>-<platform>, the version from Cargo.toml (the tag matches it).
      - name: Name the archive
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          echo "ARCHIVE=vcmp-$version-${{ matrix.platform }}" >> "$GITHUB_ENV"

      # A folder of the program and the licence texts, packed as one archive.
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "dist/$env:ARCHIVE"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/vcmp.exe", LICENSE-MIT, LICENSE-APACHE $dir
          Copy-Item assets/fonts/sora/OFL.txt "$dir/Sora-OFL.txt"
          Compress-Archive -Path $dir -DestinationPath "dist/$env:ARCHIVE.zip"
          Remove-Item -Recurse $dir

      # The app bundle carries the licence texts in its Resources. target/packages/
      # is cleared first so that a bundle from the restored cache cannot be packed.
      # ditto keeps the bundle's links and attributes, which zip does not.
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          rm -rf target/packages
          cargo packager --release -p vcmp-app --target ${{ matrix.target }} --formats app
          mkdir -p dist
          ditto -c -k --keepParent target/packages/VCMP.app "dist/$ARCHIVE.zip"

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "dist/$ARCHIVE"
          cp "target/${{ matrix.target }}/release/vcmp" LICENSE-MIT LICENSE-APACHE "dist/$ARCHIVE/"
          cp assets/fonts/sora/OFL.txt "dist/$ARCHIVE/Sora-OFL.txt"
          tar -C dist -czf "dist/$ARCHIVE.tar.gz" "$ARCHIVE"
          rm -rf "dist/$ARCHIVE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Draft the GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --verify-tag
          --title "VCMP ${GITHUB_REF_NAME#v}"
          --generate-notes
