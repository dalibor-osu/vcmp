[package]
name = "vcmp-mcp"
description = "VCMP's MCP server: AI agents read the library and ask for changes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
getrandom = "0.3.4"
log = "0.4.34"
rmcp = { version = "3.6.0", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt", "net", "sync", "macros"] }
tokio-util = "0.7"
# The relay's HTTP client, and covers agents give by web address; already in the
# build for Last.fm, TLS included.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
vcmp-library = { version = "26.10.2", path = "../vcmp-library" }

[dev-dependencies]
dunce = "1.0.5"
lofty = "0.25.4"
tempfile = "3.27.0"
