[package]
name = "vcmp-app"
description = "VCMP desktop music player"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "vcmp"
path = "src/main.rs"

[dependencies]
directories = "6.0.0"
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
log = "0.4.34"
rfd = "0.17.2"
slint.workspace = true
vcmp-integrations = { version = "0.1.0", path = "../vcmp-integrations" }
vcmp-library = { version = "0.1.0", path = "../vcmp-library" }
vcmp-playback = { version = "0.1.0", path = "../vcmp-playback" }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
dunce = "1.0.5"
i-slint-backend-testing = "=1.18.1"
lofty = "0.25.4"
png = "0.18.1"
tempfile = "3.27.0"
vcmp-integrations = { path = "../vcmp-integrations" }
