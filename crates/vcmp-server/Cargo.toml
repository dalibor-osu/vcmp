[package]
name = "vcmp-server"
description = "VCMP server: streams a music library to the VCMP app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "vcmp-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
base64 = "0.23.1"
env_logger = "0.11.11"
getrandom = "0.3.4"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "fs", "io-util", "sync", "macros", "time", "signal"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1.1.8"
vcmp-library = { version = "26.11.0", path = "../vcmp-library" }
vcmp-protocol = { version = "26.11.0", path = "../vcmp-protocol" }

[dev-dependencies]
dunce = "1.0.5"
image = { version = "0.25.10", default-features = false, features = ["png"] }
lofty = "0.25.4"
ureq = { version = "3.4.2", default-features = false }
